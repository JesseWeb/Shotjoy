name: macOS build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Swift version
        run: swift --version
      - name: Core tests
        run: swift test --filter ShotjoyCoreTests
      - name: Build app bundle
        run: ./scripts/make-app.sh release
      - name: Check bundle layout
        run: |
          test -x dist/Shotjoy.app/Contents/MacOS/Shotjoy
          test -f dist/Shotjoy.app/Contents/Info.plist
          test -f dist/Shotjoy.app/Contents/Resources/AppIcon.icns
          codesign --verify --strict dist/Shotjoy.app
          echo "Bundle layout OK"
